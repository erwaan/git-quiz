<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Quiz Git — Rejoindre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <script type="module">
    import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, update }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    /* ════════════════════════════════════════════════════════════════
       REMPLACEZ PAR VOTRE CONFIG FIREBASE (identique à host.html)
    ════════════════════════════════════════════════════════════════ */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCYjE4JQfZATN1EDDBEJR3Hmkj_ASkubSY",
      authDomain: "git-quiz-33186.firebaseapp.com",
      databaseURL: "https://git-quiz-33186-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "git-quiz-33186",
      storageBucket: "git-quiz-33186.firebasestorage.app",
      messagingSenderId: "968980471020",
      appId: "1:968980471020:web:ca234a472923b5a235d9c9"
    };
    /* ════════════════════════════════════════════════════════════════ */

    const LETTERS = ['A','B','C','D','E','F'];
    const COLORS  = ['#00e5a0','#ff6b35','#7b61ff','#ffd93d','#ff4757','#48dbfb'];

    let db, sessionId, playerId, playerName;
    let currentScore = 0, hasAnswered = false, myLastChoice = null;
    let showLeaderboard = false;
    let unsubState;

    function getPlayerId() {
      let id = sessionStorage.getItem('quiz-pid');
      if (!id) { id = 'p_' + Math.random().toString(36).substring(2,12); sessionStorage.setItem('quiz-pid', id); }
      return id;
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    /* ── INIT ── */
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        db = getDatabase(app);
        const code = new URLSearchParams(location.search).get('s');
        if (code) document.getElementById('code-input').value = code.toUpperCase();
      } catch(e) {
        document.getElementById('view-join').innerHTML =
          `<div class="error-box"><h2>⚠️ Firebase non configuré</h2>
           <p>Le fichier <code>index.html</code> doit contenir votre config Firebase.</p>
           <p>Consultez <strong>FIREBASE_SETUP.md</strong>.</p></div>`;
      }
    });

    /* ════════════════════════════════════════════════════════════════
       JOIN
    ════════════════════════════════════════════════════════════════ */
    window._join = async function() {
      const codeRaw = document.getElementById('code-input').value.trim().toUpperCase();
      const name    = document.getElementById('name-input').value.trim();

      if (codeRaw.length !== 4) { shake('code-input'); return; }
      if (!name)                 { shake('name-input'); return; }

      const btn = document.getElementById('btn-join');
      btn.disabled = true; btn.textContent = 'Connexion…';

      try {
        const snap = await get(ref(db, `sessions/${codeRaw}`));
        if (!snap.exists()) {
          showFieldError('code-input', 'Session introuvable');
          btn.disabled = false; btn.textContent = 'Rejoindre →';
          return;
        }

        sessionId       = codeRaw;
        playerName      = name;
        playerId        = getPlayerId();
        currentScore    = 0;
        showLeaderboard = snap.val().showLeaderboard || false;

        await set(ref(db, `sessions/${sessionId}/players/${playerId}`), { name });

        document.getElementById('view-join').style.display = 'none';
        document.getElementById('view-app').style.display  = '';
        watchState();
      } catch(e) {
        btn.disabled = false; btn.textContent = 'Rejoindre →';
        showFieldError('code-input', 'Erreur réseau, réessayez');
      }
    };

    /* ── Enter key on inputs ── */
    window.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('view-join').style.display !== 'none') {
        window._join();
      }
    });

    function shake(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
    }

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('error');
      let hint = el.parentElement.querySelector('.field-error');
      if (!hint) { hint = document.createElement('div'); hint.className='field-error'; el.parentElement.appendChild(hint); }
      hint.textContent = msg;
    }

    /* ════════════════════════════════════════════════════════════════
       STATE WATCHER
    ════════════════════════════════════════════════════════════════ */
    function watchState() {
      if (unsubState) unsubState();
    
      console.log("👀 WATCHING STATE:", sessionId);
    
      unsubState = onValue(ref(db, `sessions/${sessionId}/state`), snap => {
        const state = snap.val();
    
        console.log("📡 STATE RAW SNAP:", snap);
        console.log("📡 STATE VALUE:", state);
    
        if (!state) {
          console.warn("⚠️ STATE NULL");
          showLoading();
          return;
        }
    
        if (!state.phase) {
          console.warn("⚠️ STATE WITHOUT PHASE", state);
          showLoading();
          return;
        }
    
        console.log("✅ RENDERING PHASE:", state.phase);
    
        renderState(state);
      }, (err) => {
        console.error("🔥 FIREBASE ERROR:", err);
      });
    }
    
    function showLoading() {
      document.getElementById('view-app').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#5a7070">
          Connexion à la session…
        </div>`;
    }

    function renderState(state) {
      try {
        const app = document.getElementById('view-app');
    
        console.log("🎯 renderState()", state);
    
        switch (state.phase) {
          case 'lobby':
            console.log("➡️ LOBBY");
            app.innerHTML = renderLobby();
            break;
    
          case 'question':
            console.log("➡️ QUESTION");
            hasAnswered = false;
            myLastChoice = null;
            app.innerHTML = renderQuestion(state);
            break;
    
        case 'reveal':
          console.log("🔍 REVEAL - choices:", state.choices, "answer:", state.answer);
          const html = renderQuestion(state);
          console.log("🔍 HTML généré:", html.substring(0, 200));
          document.getElementById('view-app').innerHTML = html;
          requestAnimationFrame(() => {
            const btns = document.querySelectorAll('.choice-p');
            console.log("🔍 Boutons trouvés après RAF:", btns.length);
            renderReveal(state);
          });
          break;
    
          case 'final':
            console.log("➡️ FINAL");
            renderFinal();
            break;
    
          default:
            console.warn("❓ UNKNOWN PHASE:", state.phase);
            showLoading();
        }
      } catch (e) {
        console.error("💥 RENDER CRASH:", e);
        document.getElementById('view-app').innerHTML = `
          <div style="color:red;padding:20px">
            Erreur render: ${e.message}
          </div>`;
      }
    }
    /* ── LOBBY ── */
    function renderLobby() {
      return `
        <div class="screen-lobby-p">
          <div class="lobby-icon">⏳</div>
          <div class="lobby-name">Bonjour, <strong>${esc(playerName)}</strong>&nbsp;!</div>
          <div class="lobby-wait">En attente du démarrage par l'animateur…</div>
          <div class="lobby-code">Session&ensp;<span>${sessionId}</span></div>
        </div>`;
    }

    /* ── QUESTION ── */
    function renderQuestion(state) {
      // ✅ Convertir choices en tableau si Firebase l'a transformé en objet
      const choices = Array.isArray(state.choices)
        ? state.choices
        : Object.values(state.choices || {});
    
      return `
        <div class="screen-q-p">
          <div class="q-top-bar">
            <span class="q-pill">Q${state.qIdx + 1}</span>
            <span class="score-pill">⭐&nbsp;${currentScore}&thinsp;pt${currentScore>1?'s':''}</span>
          </div>
          <div class="q-text-p">${state.question}</div>
          <div class="choices-p">
            ${choices.map((c,i) => `
              <button class="choice-p" style="--col:${COLORS[i]}" id="cp${i}"
                onclick="window._answer(${i})">
                <span class="cp-letter">${LETTERS[i]}</span>
                <span class="cp-text">${c}</span>
              </button>`).join('')}
          </div>
        </div>`;
    }

    window._answer = async function(choiceIdx) {
      if (hasAnswered) return;
      hasAnswered  = true;
      myLastChoice = choiceIdx;

      await set(ref(db, `sessions/${sessionId}/currentAnswers/${playerId}`), {
        choice: choiceIdx,
        name:   playerName,
        ts:     Date.now()
      });

      // Visual feedback: dim others, confirm selected
      document.querySelectorAll('.choice-p').forEach((btn, i) => {
        btn.disabled = true;
        if (i !== choiceIdx) btn.style.opacity = '0.3';
        else btn.classList.add('selected');
      });

      // Insert waiting banner
      const qText = document.querySelector('.q-text-p');
      if (qText) {
        const banner = document.createElement('div');
        banner.className = 'waiting-msg';
        banner.textContent = '✓ Réponse enregistrée — en attente de la correction…';
        qText.insertAdjacentElement('afterend', banner);
      }
    };

    /* ── REVEAL ── */
    let lastRevealedQIdx = -1; // variable globale en haut du script

    function renderReveal(state) {
      const correctIdx = state.answer;
      if (correctIdx === null || correctIdx === undefined) return;
    
      const choices = document.querySelectorAll('.choice-p');
      if (!choices.length) {
        console.error("❌ Aucun bouton .choice-p trouvé dans le DOM !");
        return;
      }
    
      // ✅ Ne compter le score qu'une seule fois par question
      const alreadyScored = lastRevealedQIdx === state.qIdx;
      
      let wasCorrect = false;
      choices.forEach((btn, i) => {
        btn.disabled = true;
        btn.style.opacity = '';
        if (i === correctIdx) {
          btn.classList.add('reveal-correct');
          if (i === myLastChoice) wasCorrect = true;
        } else {
          btn.classList.add('reveal-wrong');
        }
      });
    
      if (wasCorrect && !alreadyScored) currentScore++;
      lastRevealedQIdx = state.qIdx;
    
      const existing = document.querySelector('.waiting-msg');
      const msg = document.createElement('div');
      msg.className = wasCorrect
        ? 'waiting-msg correct-msg'
        : (myLastChoice === null ? 'waiting-msg neutral-msg' : 'waiting-msg wrong-msg');
      msg.textContent = wasCorrect
        ? '🎉 Bonne réponse ! +1 point'
        : myLastChoice === null
          ? "Temps écoulé — vous n'avez pas répondu"
          : '✗ Mauvaise réponse';
    
      if (existing) existing.replaceWith(msg);
      else {
        const qText = document.querySelector('.q-text-p');
        if (qText) qText.insertAdjacentElement('afterend', msg);
      }
    
      const pill = document.querySelector('.score-pill');
      if (pill) pill.textContent = `⭐ ${currentScore} pt${currentScore > 1 ? 's' : ''}`;
    
      if (!alreadyScored) {
        update(ref(db, `sessions/${sessionId}/scores/${playerId}`), {
          name: playerName,
          score: currentScore
        });
      }
    }

    /* ── FINAL ── */
    function renderFinal() {
      if (showLeaderboard) {
        renderFinalLeaderboard();
      } else {
        renderFinalStats();
      }
    }

    function renderFinalLeaderboard() {
      onValue(ref(db, `sessions/${sessionId}/scores`), snap => {
        const scores = snap.val() || {};
        const sorted = Object.values(scores).sort((a,b) => b.score - a.score);
        const myRank = sorted.findIndex(p => p.name === playerName && p.score === currentScore) + 1;
        const medals = ['🥇','🥈','🥉'];

        document.getElementById('view-app').innerHTML = `
          <div class="screen-final-p">
            <div class="final-icon">${myRank===1?'🏆':myRank===2?'🥈':myRank===3?'🥉':'🎓'}</div>
            <div class="final-rank">${myRank>0?`#${myRank}`:'—'}</div>
            <div class="final-name">${esc(playerName)}</div>
            <div class="final-score">${currentScore} point${currentScore!==1?'s':''}</div>
            <div class="podium-mini">
              ${sorted.slice(0,5).map((p,i) => `
                <div class="pm-row ${p.name===playerName?'me':''}">
                  <span class="pm-rank">${medals[i]||i+1}</span>
                  <span class="pm-name">${esc(p.name)}</span>
                  <span class="pm-score">${p.score}&thinsp;pt${p.score!==1?'s':''}</span>
                </div>`).join('')}
            </div>
          </div>`;
      }, { onlyOnce: true });
    }

    function renderFinalStats() {
      // No names, just show the player their personal result
      const pct = Math.round(currentScore / Math.max(1, currentScore) * 100); // will update with total Q count below
      onValue(ref(db, `sessions/${sessionId}`), snap => {
        const session = snap.val() || {};
        const total   = session.questionCount || 1;
        const p       = Math.round(currentScore / total * 100);
        let emoji = p >= 80 ? '🎉' : p >= 50 ? '👍' : '📖';
        let msg   = p >= 80 ? 'Excellent !' : p >= 50 ? 'Pas mal !' : 'À réviser…';

        document.getElementById('view-app').innerHTML = `
          <div class="screen-final-p anon">
            <div class="final-icon">${emoji}</div>
            <div class="final-score-big">${p}%</div>
            <div class="final-score-label">de bonnes réponses</div>
            <div class="final-msg">${msg}</div>
            <div class="final-detail">${currentScore} / ${total} correctes</div>
          </div>`;
      }, { onlyOnce: true });
    }
  </script>
  <style>
    :root {
      --bg:      #0a0c0c;
      --surface: #111515;
      --surface2:#181e1e;
      --border:  #222d2d;
      --accent:  #00e5a0;
      --accent2: #ff6b35;
      --text:    #e8f0ee;
      --muted:   #5a7070;
      --correct: #00c97a;
      --wrong:   #ff4757;
      --mono:    'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:var(--mono); min-height:100vh; }

    /* ── JOIN SCREEN ── */
    #view-join { max-width:420px; margin:0 auto; padding:48px 24px; }
    .join-brand { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); border:1px solid var(--accent); padding:3px 10px; display:inline-block; margin-bottom:24px; }
    .join-title { font-family:var(--display); font-size:clamp(2rem,8vw,3rem); font-weight:800; line-height:1.1; margin-bottom:8px; }
    .join-title span { color:var(--accent); }
    .join-sub   { color:var(--muted); font-size:13px; margin-bottom:36px; line-height:1.6; }
    .field      { margin-bottom:16px; }
    .field label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:7px; }
    .field input {
      width:100%; background:var(--surface); border:1px solid var(--border);
      color:var(--text); font-family:var(--mono); font-size:16px;
      padding:14px 16px; outline:none; transition:border-color .15s;
      -webkit-appearance:none; border-radius:0;
    }
    .field input:focus { border-color:var(--accent); }
    .field input.error { border-color:var(--wrong); }
    .field input.shake { animation:shake .35s ease; }
    .field-error { font-size:11px; color:var(--wrong); margin-top:5px; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    #code-input { letter-spacing:.3em; text-transform:uppercase; font-size:1.4rem; font-weight:700; text-align:center; }
    .btn-join { width:100%; background:var(--accent); color:var(--bg); font-family:var(--mono); font-size:14px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:none; padding:16px; cursor:pointer; transition:opacity .15s; margin-top:8px; border-radius:0; }
    .btn-join:hover { opacity:.85; }
    .btn-join:disabled { opacity:.5; cursor:default; }

    /* ── APP ── */
    #view-app { display: ''; }

    /* Lobby wait */
    .screen-lobby-p { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; text-align:center; gap:12px; }
    .lobby-icon { font-size:3rem; animation:rotate 4s linear infinite; }
    @keyframes rotate { to { transform:rotate(360deg); } }
    .lobby-name  { font-family:var(--display); font-size:1.3rem; font-weight:800; }
    .lobby-wait  { color:var(--muted); font-size:13px; line-height:1.6; max-width:280px; }
    .lobby-code  { font-size:12px; color:var(--muted); margin-top:4px; }
    .lobby-code span { color:var(--accent); font-weight:700; letter-spacing:.15em; }

    /* Question */
    .screen-q-p { padding:20px 18px 40px; max-width:520px; margin:0 auto; }
    .q-top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
    .q-pill { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); border:1px solid rgba(0,229,160,.4); padding:3px 10px; }
    .score-pill { font-size:12px; font-weight:700; color:var(--accent); background:rgba(0,229,160,.1); padding:3px 10px; }
    .q-text-p { font-family:var(--display); font-size:clamp(1.05rem,4.5vw,1.35rem); font-weight:800; line-height:1.4; margin-bottom:22px; border-left:3px solid var(--accent); padding-left:14px; }
    .choices-p { display:flex; flex-direction:column; gap:10px; }
    .choice-p {
      background:var(--surface); border:1px solid var(--border); color:var(--text);
      font-family:var(--mono); font-size:14px; padding:16px 14px; text-align:left;
      cursor:pointer; display:flex; align-items:center; gap:14px;
      transition:border-color .15s, background .15s, opacity .2s;
      -webkit-tap-highlight-color:transparent; min-height:58px; border-radius:0;
    }
    .choice-p:active:not(:disabled) { transform:scale(.98); }
    .choice-p:not(:disabled):not(.selected):hover { border-color:var(--col); background:rgba(0,229,160,.05); }
    .cp-letter { font-weight:700; color:var(--col); min-width:20px; flex-shrink:0; }
    .cp-text   { line-height:1.4; }
    .choice-p.selected       { border-color:var(--col); background:rgba(0,229,160,.1); }
    .choice-p.reveal-correct { border-color:var(--correct)!important; background:rgba(0,201,122,.15)!important; opacity:1!important; }
    .choice-p.reveal-wrong   { opacity:.3!important; }
    .waiting-msg { margin-top:18px; padding:12px 16px; font-size:13px; line-height:1.5; border-left:3px solid var(--muted); background:rgba(90,112,112,.1); color:var(--muted); }
    .correct-msg  { border-color:var(--correct); background:rgba(0,201,122,.1);  color:var(--correct); }
    .wrong-msg    { border-color:var(--wrong);   background:rgba(255,71,87,.1);  color:#ff8a96; }
    .neutral-msg  { border-color:var(--accent2); background:rgba(255,107,53,.1); color:var(--accent2); }

    /* Final — leaderboard */
    .screen-final-p { display:flex; flex-direction:column; align-items:center; padding:48px 20px; max-width:440px; margin:0 auto; text-align:center; gap:6px; }
    .final-icon  { font-size:3.5rem; }
    .final-rank  { font-family:var(--display); font-size:4rem; font-weight:800; color:var(--accent); line-height:1; }
    .final-name  { font-family:var(--display); font-size:1.3rem; font-weight:800; margin-top:4px; }
    .final-score { font-size:14px; color:var(--muted); margin-bottom:24px; }
    .podium-mini { width:100%; display:flex; flex-direction:column; gap:8px; }
    .pm-row { display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); padding:12px 14px; font-size:13px; }
    .pm-row.me { border-color:var(--accent); background:rgba(0,229,160,.07); }
    .pm-rank  { color:var(--muted); font-size:1.1rem; text-align:center; }
    .pm-name  { text-align:left; font-family:var(--display); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pm-score { color:var(--accent); font-weight:700; white-space:nowrap; }

    /* Final — anonymous stats */
    .screen-final-p.anon { gap:8px; }
    .final-score-big   { font-family:var(--display); font-size:5rem; font-weight:800; color:var(--accent); line-height:1; }
    .final-score-label { font-size:13px; color:var(--muted); }
    .final-msg    { font-family:var(--display); font-size:1.3rem; font-weight:800; margin-top:8px; }
    .final-detail { font-size:13px; color:var(--muted); margin-top:4px; }

    /* Error */
    .error-box { max-width:420px; margin:60px auto; padding:32px; background:var(--surface); border:1px solid var(--wrong); }
    .error-box h2 { font-family:var(--display); color:var(--wrong); margin-bottom:12px; }
    .error-box p  { font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:8px; }
    .error-box code { color:var(--accent2); }

    ::-webkit-scrollbar { width:6px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  </style>
</head>
<body>
  <!-- JOIN -->
  <div id="view-join">
    <div class="join-brand">Formation Git</div>
    <div class="join-title">Quiz<br><span>Participatif</span></div>
    <p class="join-sub">Scannez le QR code ou entrez le code de session affiché sur l'écran.</p>
    <div class="field">
      <label>Code de session</label>
      <input id="code-input" type="text" maxlength="4" placeholder="XXXX"
             autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"/>
    </div>
    <div class="field">
      <label>Votre prénom</label>
      <input id="name-input" type="text" maxlength="20" placeholder="Jean"
             autocomplete="given-name"/>
    </div>
    <button class="btn-join" id="btn-join" onclick="window._join()">Rejoindre →</button>
  </div>

  <!-- APP (post-join) -->
  <div id="view-app"></div>
</body>
</html>
