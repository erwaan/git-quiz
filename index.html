<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Git — Formation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f0f;
      --surface: #141818;
      --surface2: #1c2222;
      --border: #2a3333;
      --accent: #00e5a0;
      --accent2: #ff6b35;
      --text: #e8f0ee;
      --muted: #6b8080;
      --correct: #00c97a;
      --wrong: #ff4757;
      --mono: 'Space Mono', monospace;
      --display: 'Syne', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      position: relative;
      z-index: 1;
    }

    /* ── VIEWS ── */
    .view { display: none; }
    .view.active { display: block; animation: slideIn 0.35s ease; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADER ── */
    header { margin-bottom: 48px; }

    .tag {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 10px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: var(--display);
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    h1 span { color: var(--accent); }

    .subtitle { color: var(--muted); font-size: 13px; line-height: 1.6; }

    /* ── GLOBAL PROGRESS ── */
    .global-progress { margin-bottom: 40px; }

    .global-progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .global-progress-bar-wrap {
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .global-progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.6s ease;
      box-shadow: 0 0 10px rgba(0,229,160,0.35);
    }

    /* ── QUIZ GRID (home) ── */
    .quiz-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 28px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .quiz-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      background: rgba(0,229,160,0.04);
    }

    .quiz-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .quiz-card:hover::after { opacity: 1; }
    .quiz-card.done::after { opacity: 1; background: var(--correct); }
    .quiz-card.done { border-color: rgba(0,201,122,0.3); }

    .qc-num {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .qc-title {
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .qc-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .qc-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .qc-left { display: flex; flex-direction: column; gap: 5px; }

    .score-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      letter-spacing: 0.04em;
    }

    .score-badge.todo { border: 1px solid var(--border); color: var(--muted); }
    .score-badge.good { border: 1px solid var(--correct); color: var(--correct); background: rgba(0,201,122,0.1); }
    .score-badge.low  { border: 1px solid var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.1); }

    .qc-count { font-size: 11px; color: var(--muted); }

    .btn-card {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      padding: 9px 16px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .btn-card.start { background: var(--accent); color: var(--bg); }
    .btn-card.replay { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .btn-card:hover { opacity: 0.82; }

    /* reset scores link */
    .reset-link {
      display: block;
      margin-top: 28px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: 0.05em;
      text-align: right;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .reset-link:hover { color: var(--wrong); }

    /* ── QUIZ VIEW header ── */
    .quiz-nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .btn-back {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 7px 14px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-back:hover { border-color: var(--text); color: var(--text); }

    .quiz-nav-title {
      font-family: var(--display);
      font-size: 0.95rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* progress bar */
    .prog-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .prog-bar-wrap {
      height: 3px;
      background: var(--border);
      margin-bottom: 32px;
    }

    .prog-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.4s ease;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── QUESTION ── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 36px;
      margin-bottom: 20px;
      animation: slideIn 0.35s ease;
    }

    .q-number {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .q-text {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .q-image {
      width: 100%;
      max-width: 480px;
      margin: 18px 0;
      border: 1px solid var(--border);
      display: block;
    }

    .q-hint { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 6px; }

    .choices { display: grid; gap: 10px; margin-top: 28px; }

    .choice-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 14px 18px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      line-height: 1.5;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(0,229,160,0.07);
      transform: translateX(4px);
    }

    .choice-btn .cl { font-weight: 700; color: var(--accent); min-width: 18px; flex-shrink: 0; }
    .choice-btn.correct { border-color: var(--correct); background: rgba(0,201,122,0.12); }
    .choice-btn.correct .cl { color: var(--correct); }
    .choice-btn.wrong { border-color: var(--wrong); background: rgba(255,71,87,0.1); }
    .choice-btn.wrong .cl { color: var(--wrong); }
    .choice-btn:disabled { cursor: default; }

    code {
      font-family: var(--mono);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 1px 6px;
      font-size: 0.92em;
      color: var(--accent2);
    }

    .feedback {
      padding: 16px 20px;
      border-left: 3px solid;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 4px;
      animation: slideIn 0.25s ease;
    }

    .feedback.ok { border-color: var(--correct); background: rgba(0,201,122,0.08); color: var(--correct); }
    .feedback.ko { border-color: var(--wrong); background: rgba(255,71,87,0.08); color: #ff8a96; }

    .btn-next {
      margin-top: 28px;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.08em;
      border: none;
      padding: 14px 28px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-next:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── SCORE SCREEN ── */
    .score-screen {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 48px 36px;
      text-align: center;
      animation: slideIn 0.4s ease;
    }

    .score-big {
      font-family: var(--display);
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 800;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .score-big.low { color: var(--accent2); }
    .score-label { font-size: 13px; color: var(--muted); margin-bottom: 28px; }

    .score-msg {
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 32px;
    }

    .score-details {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 36px;
    }

    .score-stat .val { display: block; font-size: 1.5rem; font-weight: 700; font-family: var(--display); }
    .score-stat .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

    .score-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 13px 22px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary:hover { background: rgba(0,229,160,0.1); }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 13px 22px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.85; }

    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
<div class="container">

  <!-- ══════════════════════════════
       HOME VIEW
  ══════════════════════════════ -->
  <div id="view-home" class="view active">
    <header>
      <div class="tag">Formation interne</div>
      <h1>Quiz<br><span>Git</span></h1>
      <p class="subtitle">Sélectionnez un module pour tester vos connaissances.</p>
    </header>

    <div class="global-progress">
      <div class="global-progress-top">
        <span>Progression globale</span>
        <span id="global-count">—</span>
      </div>
      <div class="global-progress-bar-wrap">
        <div class="global-progress-bar-fill" id="global-bar" style="width:0%"></div>
      </div>
    </div>

    <div class="quiz-grid" id="quiz-grid"></div>
    <span class="reset-link" onclick="resetScores()">Réinitialiser tous les scores</span>
  </div>

  <!-- ══════════════════════════════
       QUIZ VIEW
  ══════════════════════════════ -->
  <div id="view-quiz" class="view">
    <div class="quiz-nav">
      <button class="btn-back" onclick="goHome()">← Accueil</button>
      <div class="quiz-nav-title" id="quiz-nav-title"></div>
    </div>

    <div class="prog-label" id="prog-label"></div>
    <div class="prog-bar-wrap">
      <div class="prog-bar-fill" id="prog-bar" style="width:0%"></div>
    </div>

    <div id="quiz-area"></div>

    <div class="score-screen hidden" id="score-screen">
      <div class="score-big" id="score-pct">—</div>
      <div class="score-label">de bonnes réponses</div>
      <div class="score-msg" id="score-msg">—</div>
      <div class="score-details">
        <div class="score-stat">
          <span class="val" id="s-correct">—</span>
          <span class="lbl">Correctes</span>
        </div>
        <div class="score-stat">
          <span class="val" id="s-wrong">—</span>
          <span class="lbl">Incorrectes</span>
        </div>
        <div class="score-stat">
          <span class="val" id="s-total">—</span>
          <span class="lbl">Total</span>
        </div>
      </div>
      <div class="score-actions">
        <button class="btn-secondary" onclick="restartCurrent()">↺ Recommencer</button>
        <button class="btn-primary" onclick="goHome()">← Retour accueil</button>
      </div>
    </div>
  </div>

</div>
<script>
/* ===================================================================
   CONFIGURATION DES QUIZ
   ─────────────────────────────────────────────────────────────────
   Chaque entrée dans QUIZZES est un quiz complet.

   {
     id:    "identifiant-unique",     ← utilisé pour sauvegarder le score
     title: "Titre de la carte",
     desc:  "Courte description",
     questions: [
       {
         q:       "Texte HTML de la question",
         image:   "images/mon-schema.png",   // OPTIONNEL
         hint:    "Indice affiché en gris",  // OPTIONNEL
         choices: ["Réponse A", "Réponse B", "Réponse C", "Réponse D"],
         answer:  0,                         // index 0-based de la bonne réponse
         explain: "Explication après réponse (HTML autorisé)"
       },
       ...
     ]
   }
=================================================================== */
const QUIZZES = [
  /* ── QUIZ 1 ─────────────────────────────────────────────── */
  {
    id: "git-intro",
    title: "Quiz 1 — Introduction à Git",
    desc: "Qu'est-ce que Git, les 3 zones, notions fondamentales.",
    questions: [
      {
        q: "Qu'est-ce que Git ?",
        choices: [
          "Un hébergeur de code en ligne comme GitHub ou GitLab",
          "Un système de contrôle de version local qui suit l'historique de vos fichiers",
          "Un éditeur de texte pour développeurs",
          "Un langage de programmation orienté objet"
        ],
        answer: 1,
        explain: "Git est un outil <em>local</em> de gestion de versions. Il suit et gère l'évolution de vos fichiers au fil du temps. GitHub, Gitea, etc. sont des plateformes distantes distinctes."
      },
      {
        q: "Que représente un <strong>commit</strong> dans Git ?",
        choices: [
          "Une sauvegarde automatique toutes les 5 minutes",
          "Une étape dans l'historique du projet, identifiée par un message",
          "L'envoi du code vers le serveur distant",
          "La fusion de deux branches"
        ],
        answer: 1,
        explain: "Un commit est un instantané de l'état de votre projet à un moment donné. Il est identifié par un hash unique et un message descriptif, et fait partie de l'historique permanent."
      },
      {
        q: "Quels sont les 3 états (zones) dans lesquels peut se trouver un fichier dans Git ?",
        choices: [
          "Local, Remote, Cloud",
          "Draft, Review, Published",
          "Working directory, Staging area, Repository",
          "Modified, Compiled, Deployed"
        ],
        answer: 2,
        explain: "Les 3 zones de Git : le <strong>Working directory</strong> (espace de travail), la <strong>Staging area / Index</strong> (zone de préparation) et le <strong>Repository</strong> (dépôt local ou distant)."
      },
      {
        q: "À quoi sert la <strong>Staging Area</strong> (Index) ?",
        choices: [
          "À stocker les commits envoyés vers le serveur distant",
          "À sélectionner précisément les fichiers qu'on veut inclure dans le prochain commit",
          "À afficher l'historique des modifications",
          "À sauvegarder automatiquement le projet"
        ],
        answer: 1,
        explain: "La Staging Area permet de préparer son commit avec précision : on choisit fichier par fichier ce qui sera enregistré, et on peut réviser avant de valider."
      },
      {
        q: "Parmi ces noms de fichiers, lequel illustre le problème que Git est censé résoudre ?",
        choices: [
          "<code>README.md</code>",
          "<code>script.sh</code>",
          "<code>mon_script_v2_final_pour_de_vrai_final.sh</code>",
          "<code>.gitignore</code>"
        ],
        answer: 2,
        explain: "Git évite la prolifération de fichiers comme <em>v2_final_vraiment_final</em>. Avec Git, une seule version du fichier existe ; tout l'historique est accessible via les commits."
      },
      {
        q: "Que garantit le <strong>hash unique</strong> associé à chaque commit ?",
        choices: [
          "Que le commit a bien été envoyé sur le serveur distant",
          "Que le message du commit est correctement formaté",
          "L'intégrité et la traçabilité : chaque commit est identifié de façon cryptographiquement unique",
          "Que le commit a été relu et approuvé par un collègue"
        ],
        answer: 2,
        explain: "Chaque commit est identifié par un hash SHA-1 unique. Cela garantit l'intégrité des données : toute modification, même minime, produirait un hash différent."
      }
    ]
  },

  /* ── QUIZ 2 ─────────────────────────────────────────────── */
  {
    id: "git-commandes",
    title: "Quiz 2 — Commandes du quotidien",
    desc: "add, commit, push, pull et le workflow standard.",
    questions: [
      {
        q: "Quelle commande permet d'ajouter <em>tous</em> les fichiers modifiés du projet à l'index ?",
        choices: [
          "<code>git commit -a</code>",
          "<code>git add .</code>",
          "<code>git add -A</code>",
          "<code>git push --all</code>"
        ],
        answer: 2,
        explain: "<code>git add -A</code> (ou <code>--all</code>) ajoute tous les fichiers modifiés, ajoutés ou supprimés du projet entier. <code>git add .</code> fait de même mais uniquement pour le répertoire courant."
      },
      {
        q: "Quelle commande permet d'écrire le message de commit <em>directement</em> sans ouvrir un éditeur ?",
        choices: [
          "<code>git commit --no-edit</code>",
          "<code>git commit --message</code>",
          "<code>git commit -m \"message\"</code>",
          "<code>git commit -e \"message\"</code>"
        ],
        answer: 2,
        explain: "L'option <code>-m</code> permet d'écrire le message directement en ligne de commande. Sans cette option, Git ouvre vim ou nano."
      },
      {
        q: "Que fait <code>git push</code> ?",
        choices: [
          "Télécharge les derniers commits du dépôt distant vers le dépôt local",
          "Fusionne deux branches locales",
          "Envoie les commits locaux vers le dépôt distant",
          "Crée un nouveau dépôt distant"
        ],
        answer: 2,
        explain: "<code>git push</code> synchronise le dépôt local vers le dépôt distant : il envoie les commits locaux qui n'ont pas encore été partagés."
      },
      {
        q: "Que fait <code>git pull</code> ?",
        choices: [
          "Envoie vos commits locaux sur le serveur",
          "Télécharge et intègre les commits distants dans votre dépôt local",
          "Crée une nouvelle branche à partir de la branche distante",
          "Supprime les commits locaux non partagés"
        ],
        answer: 1,
        explain: "<code>git pull</code> récupère les commits du dépôt distant et les intègre dans votre dépôt local. À faire avant chaque push pour éviter les conflits."
      },
      {
        q: "Dans quel ordre doit-on idéalement effectuer ces actions avant d'envoyer son travail ?",
        choices: [
          "push → pull → commit → add",
          "add → commit → pull → push",
          "commit → add → push → pull",
          "pull → add → push → commit"
        ],
        answer: 1,
        explain: "Le flux standard est : <strong>add</strong> → <strong>commit</strong> → <strong>pull</strong> (récupérer les changements distants) → <strong>push</strong>. Le pull avant push évite les conflits."
      },
      {
        q: "Quel est le prérequis pour pouvoir exécuter <code>git commit</code> ?",
        choices: [
          "Être connecté à Internet",
          "Avoir au moins un fichier dans la staging area (index)",
          "Avoir configuré un dépôt distant",
          "Avoir créé une branche dédiée"
        ],
        answer: 1,
        explain: "Pour commiter, il faut avoir au moins un fichier dans l'index (ajouté via <code>git add</code>). Sans cela, Git affiche une erreur indiquant qu'il n'y a rien à commiter."
      }
    ]
  },

  /* ── QUIZ 3 ─────────────────────────────────────────────── */
  {
    id: "git-demarrer",

/* ===================================================================
   MOTEUR DU QUIZ — ne pas modifier sauf si vous savez ce que vous faites
=================================================================== */

const STORE = 'git-quiz-scores-v2';

function loadScores() {
  try { return JSON.parse(localStorage.getItem(STORE)) || {}; }
  catch { return {}; }
}

function saveScore(id, correct, total) {
  const s = loadScores();
  s[id] = { correct, total, pct: Math.round(correct / total * 100) };
  localStorage.setItem(STORE, JSON.stringify(s));
}

function resetScores() {
  if (confirm('Effacer tous les scores enregistrés ?')) {
    localStorage.removeItem(STORE);
    renderHome();
  }
}

/* ─── HOME ─── */
function renderHome() {
  showView('view-home');
  const scores = loadScores();
  const done = QUIZZES.filter(q => scores[q.id]).length;
  const total = QUIZZES.length;
  const pct = total ? Math.round(done / total * 100) : 0;

  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('global-count').textContent = `${done} / ${total} quiz complétés`;

  document.getElementById('quiz-grid').innerHTML = QUIZZES.map((quiz, i) => {
    const sc = scores[quiz.id];
    const isDone = !!sc;
    const isLow = isDone && sc.pct < 70;

    const badge = isDone
      ? `<span class="score-badge ${isLow ? 'low' : 'good'}">${sc.pct}% &mdash; ${sc.correct}/${sc.total}</span>`
      : `<span class="score-badge todo">Non commencé</span>`;

    return `
      <div class="quiz-card ${isDone ? 'done' : ''}" onclick="startQuiz('${quiz.id}')">
        <div class="qc-num">Quiz ${i + 1}</div>
        <div class="qc-title">${quiz.title}</div>
        <div class="qc-desc">${quiz.desc}</div>
        <div class="qc-footer">
          <div class="qc-left">
            ${badge}
            <span class="qc-count">${quiz.questions.length} questions</span>
          </div>
          <button class="btn-card ${isDone ? 'replay' : 'start'}">
            ${isDone ? '↺ Refaire' : 'Commencer →'}
          </button>
        </div>
      </div>`;
  }).join('');
}

/* ─── QUIZ ─── */
let _quizId, _questions, _cur, _score, _answered;

function startQuiz(id) {
  const quiz = QUIZZES.find(q => q.id === id);
  _quizId = id;
  _questions = quiz.questions;
  _cur = 0;
  _score = 0;
  _answered = false;
  document.getElementById('quiz-nav-title').textContent = quiz.title;
  document.getElementById('score-screen').classList.add('hidden');
  document.getElementById('quiz-area').style.display = '';
  showView('view-quiz');
  renderQ();
}

function restartCurrent() { startQuiz(_quizId); }
function goHome() { renderHome(); }

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderQ() {
  _answered = false;
  const q = _questions[_cur];
  const total = _questions.length;
  const pct = Math.round(_cur / total * 100);
  const letters = ['A','B','C','D','E','F'];

  document.getElementById('prog-label').textContent = `Question ${_cur + 1} / ${total}`;
  document.getElementById('prog-bar').style.width = pct + '%';

  const imageHTML = q.image ? `<img class="q-image" src="${q.image}" alt="Illustration">` : '';
  const hintHTML  = q.hint  ? `<p class="q-hint">${q.hint}</p>` : '';

  document.getElementById('quiz-area').innerHTML = `
    <div class="question-card">
      <div class="q-number">Question ${_cur + 1}</div>
      <div class="q-text">${q.q}</div>
      ${hintHTML}${imageHTML}
      <div class="choices">
        ${q.choices.map((c,i) => `
          <button class="choice-btn" id="c${i}" onclick="pick(${i})">
            <span class="cl">${letters[i]}</span><span>${c}</span>
          </button>`).join('')}
      </div>
    </div>
    <div id="fb"></div>
    <button class="btn-next hidden" id="btn-next" onclick="advance()">
      ${_cur + 1 < total ? 'Question suivante →' : 'Voir les résultats →'}
    </button>`;
}

function pick(idx) {
  if (_answered) return;
  _answered = true;
  const q = _questions[_cur];
  const ok = idx === q.answer;
  if (ok) _score++;

  q.choices.forEach((_, i) => {
    const b = document.getElementById('c' + i);
    b.disabled = true;
    if (i === q.answer) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });

  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'ko'}">
      ${ok ? '✓ Correct !' : '✗ Pas tout à fait.'}&nbsp; ${q.explain}
    </div>`;
  document.getElementById('btn-next').classList.remove('hidden');
}

function advance() {
  _cur++;
  if (_cur >= _questions.length) showScore();
  else renderQ();
}

function showScore() {
  const total = _questions.length;
  const pct = Math.round(_score / total * 100);
  saveScore(_quizId, _score, total);

  const msgs = [
    [90, 'Excellent ! Tu maîtrises ce chapitre 🎉'],
    [70, 'Bon travail, encore quelques révisions !'],
    [50, 'Pas mal, mais relis les slides 📖'],
    [0,  "Courage, Git ça s'apprend avec la pratique !"]
  ];

  const msg = msgs.find(([t]) => pct >= t)[1];

  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('prog-label').textContent = 'Terminé !';
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-pct').className = 'score-big' + (pct < 70 ? ' low' : '');
  document.getElementById('score-msg').textContent = msg;
  document.getElementById('s-correct').textContent = _score;
  document.getElementById('s-wrong').textContent = total - _score;
  document.getElementById('s-total').textContent = total;
  document.getElementById('score-screen').classList.remove('hidden');
}

/* ─── INIT ─── */
renderHome();
</script>
